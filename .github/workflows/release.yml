name: Build and Deploy Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake doxygen graphviz

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew update
        brew install cmake doxygen graphviz

    - name: Install dependencies (Windows)
      if: runner.os == 'Windows'
      run: choco install cmake doxygen.install graphviz -y

    - name: Configure
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      shell: bash

    - name: Build
      run: cmake --build build --config Release
      shell: bash

    - name: Test (do not tag a broken release)
      working-directory: ./build
      run: ctest --output-on-failure
      shell: bash

    - name: Install
      run: cmake --install build --config Release --prefix package
      shell: bash

    - name: Archive
      run: tar -czf compressor-${{ runner.os }}.tar.gz -C package .
      shell: bash

    - name: Compute checksums
      run: sha256sum compressor-${{ runner.os }}.tar.gz > compressor-${{ runner.os }}.tar.gz.sha256
      shell: bash

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: compressor-${{ runner.os }}
        path: |
          compressor-${{ runner.os }}.tar.gz
          compressor-${{ runner.os }}.tar.gz.sha256

  deploy:
    name: Upload Release Assets
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: dist

    - name: Publish assets
      uses: softprops/action-gh-release@v2
      with:
        files: dist/**/compressor-*.tar.gz*
